# The full gate runs on the default shell, the current stable Zig. The
# compatibility lane has to compile and pass the suite on the previous one.
jobs:
  - recipe: ci
  - recipe: check
    shell: zig-old
  # macOS on aarch64 works for some projects and not others. It runs, shows,
  # and never fails CI.
  - recipe: check
    runners: [macos-26]
    blocking: false
