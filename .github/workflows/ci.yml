name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/ci.yml@081fb74a8d4731828de4f067e0106fef6df1bdec # main
    with:
      recipes: '["lint", "boom"]'
      non-blocking: '["boom"]'
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Deploys the docs Worker after CI passes on main. It stays skipped until
  # Terraform in baskingspot/site has registered the site, which sets the
  # variable and the secret.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/deploy-docs.yml@343c8fc1f3c56cdcd64e851cb69bf5772d062231 # v0.4.0
    with:
      account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
