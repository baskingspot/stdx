# The stdx guide. Built with `just doc` (see the justfile); the API reference
# is built by `zig build docs` and lands under /api/ in the same site.
base_url = "https://baskingspot.dev/stdx"
theme = "baskingspot"
title = "stdx"
description = "Extensions to the Zig 0.16 standard library: fixed-capacity containers, strict parsers, IPv4 types, and the primitives std lacks."

# Zola emits these by default. The site is small and the API viewer owns search.
generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/stdx"
api = true
third_party = true
